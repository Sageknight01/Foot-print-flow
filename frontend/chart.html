<!DOCTYPE html><html><head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>TF Engine</title>

    <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>

    <style>

    body{
    margin:0;
    background:#000;
    color:#0ff;
    font-family:monospace;
    overflow:hidden
    }

    #toolbar{
    position:absolute;
    top:10px;
    left:10px;
    z-index:20;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap
    }

    #panel{
    display:flex;
    gap:4px;
    flex-wrap:wrap
    }

    button{
    padding:4px 8px;
    background:#111;
    color:#0ff;
    border:1px solid #0ff
    }

    .active{
    background:#0ff;
    color:#000
    }

    #pairName{
    padding:4px 8px;
    border:1px solid #0ff
    }

    #price{
    width:100vw;
    height:50vh
    }

    #divider1{
    height:6px;
    background:#00ffff;
    cursor:row-resize
    }

    #flow{
    width:100vw;
    height:20vh;
    border-top:1px solid #00ffff
    }

    #divider2{
    height:6px;
    background:#ff00ff;
    cursor:row-resize
    }

    #rf{
    width:100vw;
    height:20vh;
    border-top:1px solid #ff00ff
    }

    #debug{
    position:absolute;
    bottom:5px;
    left:10px;
    color:#0f0;
    font-size:12px;
    z-index:20
    }

    </style>

    </head><body>

    <div id="toolbar">

    <div id="panel"></div>

    <div id="pairName"></div>

    </div>

    <div id="price"></div>

    <div id="divider1"></div>

    <div id="flow"></div>

    <div id="divider2"></div>

    <div id="rf"></div>

    <div id="debug">booting...</div>

    <script>

    const ROOT="";

    const SYMBOL=
    new URLSearchParams(location.search)
    .get("symbol")||"BTCUSDT";

    document.getElementById(
    "pairName"
    ).innerText=SYMBOL;

    const TF={
    "1s":1,
    "1m":60,
    "5m":300,
    "30m":1800,
    "1h":3600,
    "4h":14400,
    "1d":86400
    };

    let currentTF="1m";

    let autoFollow=true;

    const panel=
    document.getElementById("panel");

    for(let k in TF){

    let b=document.createElement("button");

    b.innerText=k;

    if(k===currentTF)
    b.classList.add("active");

    b.onclick=()=>{

    currentTF=k;

    document
    .querySelectorAll("button")
    .forEach(x=>
    x.classList.remove("active")
    );

    b.classList.add("active");

    render();

    };

    panel.appendChild(b);

    }

    const followBtn=
    document.createElement("button");

    followBtn.innerText="FOLLOW";

    followBtn.onclick=()=>{

    autoFollow=true;

    priceChart
    .timeScale()
    .fitContent();

    flowChart
    .timeScale()
    .fitContent();

    rfChart
    .timeScale()
    .fitContent();

    };

    panel.appendChild(followBtn);

    const priceChart=
    LightweightCharts.createChart(
    document.getElementById("price"),
    {
    layout:{
    background:{color:"#000"},
    textColor:"#0ff"
    },
    grid:{
    vertLines:{visible:false},
    horzLines:{visible:false}
    },
    timeScale:{
    timeVisible:true,
    secondsVisible:false,
    borderColor:"#0ff"
    }
    }
    );

    const candleSeries=
    priceChart.addSeries(
    LightweightCharts.CandlestickSeries,
    {}
    );

    const flowChart=
    LightweightCharts.createChart(
    document.getElementById("flow"),
    {
    layout:{
    background:{color:"#000"},
    textColor:"#0ff"
    },
    grid:{
    vertLines:{visible:false},
    horzLines:{visible:false}
    },
    timeScale:{
    timeVisible:true,
    secondsVisible:false,
    borderColor:"#0ff"
    }
    }
    );

    const flowSeries=
    flowChart.addSeries(
    LightweightCharts.LineSeries,
    {
    color:"#00ffff",
    lineWidth:2
    }
    );

    const rfChart=
    LightweightCharts.createChart(
    document.getElementById("rf"),
    {
    layout:{
    background:{color:"#000"},
    textColor:"#f0f"
    },
    grid:{
    vertLines:{visible:false},
    horzLines:{visible:false}
    },
    timeScale:{
    timeVisible:true,
    secondsVisible:false,
    borderColor:"#f0f"
    }
    }
    );

    const rfSellSeries=
    rfChart.addSeries(
    LightweightCharts.LineSeries,
    {
    color:"#ff00ff",
    lineWidth:2
    }
    );

    const rfBuySeries=
    rfChart.addSeries(
    LightweightCharts.LineSeries,
    {
    color:"#ffff00",
    lineWidth:2
    }
    );

    const divider1=
    document.getElementById("divider1");

    const divider2=
    document.getElementById("divider2");

    function resizePrice(y){

    let total=
    window.innerHeight;

    let priceHeight=
    Math.max(
    120,
    Math.min(
    total-250,
    y
    )
    );

    let flowHeight=
    document
    .getElementById("flow")
    .offsetHeight;

    let rfHeight=
    total-
    priceHeight-
    flowHeight-
    12;

    document
    .getElementById("price")
    .style.height=
    priceHeight+"px";

    document
    .getElementById("rf")
    .style.height=
    rfHeight+"px";

    priceChart.resize(
    window.innerWidth,
    priceHeight
    );

    rfChart.resize(
    window.innerWidth,
    rfHeight
    );

    }

    function resizeFlow(y){

    let total=
    window.innerHeight;

    let priceHeight=
    document
    .getElementById("price")
    .offsetHeight;

    let flowTop=
    priceHeight+6;

    let flowHeight=
    y-flowTop;

    flowHeight=Math.max(
    80,
    Math.min(
    total-180,
    flowHeight
    )
    );

    let rfHeight=
    total-
    priceHeight-
    flowHeight-
    12;

    document
    .getElementById("flow")
    .style.height=
    flowHeight+"px";

    document
    .getElementById("rf")
    .style.height=
    rfHeight+"px";

    flowChart.resize(
    window.innerWidth,
    flowHeight
    );

    rfChart.resize(
    window.innerWidth,
    rfHeight
    );

    }

    divider1.addEventListener(
    "touchmove",
    e=>{

    e.preventDefault();

    resizePrice(
    e.touches[0].clientY
    );

    },
    {passive:false}
    );

    divider2.addEventListener(
    "touchmove",
    e=>{

    e.preventDefault();

    resizeFlow(
    e.touches[0].clientY
    );

    },
    {passive:false}
    );

    divider1.addEventListener(
    "mousemove",
    e=>{

    if(e.buttons)
    resizePrice(e.clientY);

    }
    );

    divider2.addEventListener(
    "mousemove",
    e=>{

    if(e.buttons)
    resizeFlow(e.clientY);

    }
    );

    let syncing=false;

    priceChart
    .timeScale()
    .subscribeVisibleLogicalRangeChange(
    range=>{

    if(syncing)return;

    syncing=true;

    flowChart
    .timeScale()
    .setVisibleLogicalRange(range);

    rfChart
    .timeScale()
    .setVisibleLogicalRange(range);

    syncing=false;

    }
    );

    flowChart
    .timeScale()
    .subscribeVisibleLogicalRangeChange(
    range=>{

    if(syncing)return;

    syncing=true;

    priceChart
    .timeScale()
    .setVisibleLogicalRange(range);

    rfChart
    .timeScale()
    .setVisibleLogicalRange(range);

    syncing=false;

    }
    );

    rfChart
    .timeScale()
    .subscribeVisibleLogicalRangeChange(
    range=>{

    if(syncing)return;

    syncing=true;

    priceChart
    .timeScale()
    .setVisibleLogicalRange(range);

    flowChart
    .timeScale()
    .setVisibleLogicalRange(range);

    syncing=false;

    }
    );

    priceChart
    .timeScale()
    .subscribeVisibleLogicalRangeChange(
    ()=>{

    autoFollow=false;

    }
    );

    let raw=[];

    function aggregate(data,tf){

    let size=TF[tf];

    let out=[];

    let bucket=null;

    for(let c of data){

    let t=
    Math.floor(c.time/1000);

    let key=
    Math.floor(t/size)*size;

    if(!bucket||
    bucket.time!==key){

    if(bucket)
    out.push(bucket);

    bucket={
    time:key,
    open:c.open,
    high:c.high,
    low:c.low,
    close:c.close,
    flow:c.flow,
    rfSell:c.rfSell||0,
    rfBuy:c.rfBuy||0
    };

    }else{

    bucket.high=Math.max(
    bucket.high,
    c.high
    );

    bucket.low=Math.min(
    bucket.low,
    c.low
    );

    bucket.close=c.close;

    bucket.flow=c.flow;

    bucket.rfSell=
    c.rfSell||0;

    bucket.rfBuy=
    c.rfBuy||0;

    }

    }

    if(bucket)
    out.push(bucket);

    return out;

    }

    function render(){

    let data=
    aggregate(raw,currentTF);

    let candles=[];

    let flow=[];

    let rfSell=[];

    let rfBuy=[];

    for(let c of data){

    candles.push({
    time:c.time,
    open:c.open,
    high:c.high,
    low:c.low,
    close:c.close
    });

    flow.push({
    time:c.time,
    value:c.flow
    });

    rfSell.push({
    time:c.time,
    value:c.rfSell
    });

    rfBuy.push({
    time:c.time,
    value:c.rfBuy
    });

    }

    candleSeries.setData(candles);

    flowSeries.setData(flow);

    rfSellSeries.setData(rfSell);

    rfBuySeries.setData(rfBuy);

    if(autoFollow){

    priceChart
    .timeScale()
    .fitContent();

    flowChart
    .timeScale()
    .fitContent();

    rfChart
    .timeScale()
    .fitContent();

    }

    document
    .getElementById("debug")
    .innerText=
    "PAIR:"+SYMBOL+
    " | TF:"+currentTF+
    " | candles:"+candles.length;

    }

    async function load(){

    try{

    let r=await fetch(
    ROOT+"/data/"+SYMBOL
    );

    raw=await r.json();

    render();

    }catch(e){

    document
    .getElementById("debug")
    .innerText=e.message;

    }

    }

    setInterval(load,2000);

    load();

    </script>

    </body></html>
